    <div class="shell" [class]="portal().cssClass">
      <mat-toolbar class="topbar">
        <button mat-icon-button (click)="opened = !opened"><mat-icon>menu</mat-icon></button>
        <span class="brand">MSYEP</span>
        <span class="portal-name">{{ portal().name }}</span>
        <span class="spacer"></span>
        <button mat-button [matMenuTriggerFor]="menu">
          <mat-icon>account_circle</mat-icon>
          <span class="user">{{ auth.user()?.name || auth.user()?.email }}</span>
        </button>
        <mat-menu #menu="matMenu">
          <div class="menu-role">{{ auth.role() }}</div>
          <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
        </mat-menu>
      </mat-toolbar>

      <mat-sidenav-container class="container">
        <mat-sidenav [opened]="opened" mode="side" class="sidenav">
          <mat-nav-list>
            <ng-container *ngFor="let item of portal().nav">
              <!-- Group with sub-items -->
              <ng-container *ngIf="item.children?.length; else leaf">
                <a mat-list-item class="group-header" (click)="toggleGroup(item.label)">
                  <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                  <span matListItemTitle>{{ item.label }}</span>
                  <mat-icon matListItemMeta>{{ isExpanded(item.label) ? 'expand_less' : 'expand_more' }}</mat-icon>
                </a>
                <a mat-list-item *ngFor="let child of item.children" class="child-link"
                   [class.child-hidden]="!isExpanded(item.label)"
                   [routerLink]="child.path" [queryParams]="child.queryParams || null"
                   routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
                  <mat-icon matListItemIcon>{{ child.icon }}</mat-icon>
                  <span matListItemTitle>{{ child.label }}</span>
                </a>
              </ng-container>
              <!-- Plain link -->
              <ng-template #leaf>
                <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
                  <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                  <span matListItemTitle>{{ item.label }}</span>
                </a>
              </ng-template>
            </ng-container>
          </mat-nav-list>
        </mat-sidenav>
        <mat-sidenav-content class="content">
          <router-outlet></router-outlet>
        </mat-sidenav-content>
      </mat-sidenav-container>
    </div>
