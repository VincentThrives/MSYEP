    <div class="head">
      <h1>Logins</h1>
      <button mat-flat-button color="primary" (click)="editing.set(!editing())">
        <mat-icon>person_add</mat-icon> Create Login
      </button>
    </div>

    <div class="form-panel" *ngIf="editing()">
      <div class="row">
        <mat-form-field appearance="outline"><mat-label>Name</mat-label>
          <input matInput [(ngModel)]="form.name" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Email</mat-label>
          <input matInput [(ngModel)]="form.email" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="form.password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button></mat-form-field>
        <app-search-select label="Role" [options]="roles"
          [(value)]="form.role"></app-search-select>
      </div>
      <div class="row">
        <app-search-select *ngIf="form.role === 'ZONE'" label="Zone" [options]="zones()"
          valueKey="id" labelKey="name" [(value)]="form.zoneId"></app-search-select>
        <app-search-select *ngIf="form.role === 'CENTER'" label="Center" [options]="centers()"
          valueKey="id" labelKey="name" [(value)]="form.centerId"></app-search-select>
      </div>
      <div class="form-actions">
        <button mat-button (click)="editing.set(false)">Cancel</button>
        <button mat-flat-button color="primary" (click)="save()">Create</button>
      </div>
    </div>

    <!-- Search + role filter (client-side over the already-loaded list) -->
    <div class="list-filters">
      <mat-form-field appearance="outline" class="search">
        <mat-label>Search name or email</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [ngModel]="search()" (ngModelChange)="search.set($event)"
               placeholder="Start typing…" />
        <button mat-icon-button matSuffix type="button" *ngIf="search()"
                (click)="search.set('')" aria-label="Clear search">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" class="role">
        <mat-label>Role</mat-label>
        <mat-select [ngModel]="roleFilter()" (ngModelChange)="roleFilter.set($event)">
          <mat-option value="">All roles</mat-option>
          <mat-option *ngFor="let r of roleOptions()" [value]="r">{{ r }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-stroked-button class="clear" *ngIf="hasFilters()" (click)="clearFilters()">
        <mat-icon>filter_alt_off</mat-icon> Clear
      </button>

      <span class="count">{{ filteredUsers().length }} of {{ users().length }} logins</span>
    </div>

    <p class="empty" *ngIf="filteredUsers().length === 0">
      No logins match this search.
    </p>

    <table mat-table [dataSource]="filteredUsers()" class="mat-elevation-z1 full"
           [hidden]="filteredUsers().length === 0">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let u">{{ u.name }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let u">{{ u.role }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let u">
          <span class="pill" [class.off]="u.active === false">
            {{ u.active === false ? 'Deactivated' : 'Active' }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button (click)="resetPassword(u)" matTooltip="Reset password">
            <mat-icon>key</mat-icon>
          </button>
          <button mat-icon-button (click)="toggleActive(u)"
                  [matTooltip]="u.active === false ? 'Activate login' : 'Deactivate login'">
            <mat-icon>{{ u.active === false ? 'toggle_off' : 'toggle_on' }}</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="remove(u)" matTooltip="Delete login">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols"></tr>
    </table>
